<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RentIreland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
}

header {
  background: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header a {
  color: #2563eb;
  text-decoration: none;
  font-weight: bold;
}

#map {
  height: 450px;
  margin: 20px;
  border-radius: 12px;
}

.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  color: #2563eb;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>RentIreland</h1>
  <a href="upload.html">+ Add Listing</a>
</header>

<div id="map"></div>

<div class="container" id="listings"></div>

<!-- Leaflet JS (MUST be after map div) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* DATA */
const properties = [
  {
    title: "Modern 2 Bed Apartment",
    price: 2100,
    lat: 53.3498,
    lng: -6.2603,
    img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994",
    url: "property.html"
  },
  {
    title: "Galway City Apartment",
    price: 1800,
    lat: 53.2707,
    lng: -9.0568,
    img: "https://images.unsplash.com/photo-1572120360610-d971b9d7767c",
    url: "property.html"
  }
];

/* MAP (SIMPLE & STABLE) */
const map = L.map("map").setView([53.4, -8.2], 7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* RENDER */
const listings = document.getElementById("listings");

properties.forEach(p => {
  // Card
  listings.innerHTML += `
    <div class="card">
      <img src="${p.img}">
      <div class="card-content">
        <h3><a href="${p.url}">${p.title}</a></h3>
        <div class="price">€${p.price} / month</div>
      </div>
    </div>
  `;

  // Marker
  L.marker([p.lat, p.lng])
    .addTo(map)
    .bindPopup(`<strong>${p.title}</strong><br><a href="${p.url}">View</a>`);
});
</script>

</body>
</html>
