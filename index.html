<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RentIreland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
}

header {
  background: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  color: #2563eb;
}

header a {
  color: #2563eb;
  text-decoration: none;
  font-weight: bold;
}

.search-bar {
  background: white;
  padding: 15px 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.search-bar select,
.search-bar input,
.search-bar button {
  padding: 10px;
  font-size: 16px;
}

.search-bar button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

#map {
  height: 450px;
  margin: 20px;
  border-radius: 12px;
}

.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  color: #2563eb;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>RentIreland</h1>
  <a href="upload.html">+ Add Listing</a>
</header>

<div class="search-bar">
  <select id="county">
    <option value="">All counties</option>
    <option>Dublin</option>
    <option>Galway</option>
    <option>Cork</option>
  </select>
  <input id="maxPrice" type="number" placeholder="Max rent (€)">
  <button onclick="applyFilters()">Search</button>
</div>

<div id="map"></div>
<div class="container" id="listings"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================
   1. SEED / DEMO LISTINGS
========================= */
const seedListings = [
  {
    id: "seed-1",
    title: "Modern 2 Bed Apartment",
    county: "Dublin",
    price: 2100,
    lat: 53.3498,
    lng: -6.2603,
    img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994"
  },
  {
    id: "seed-2",
    title: "Galway City Apartment",
    county: "Galway",
    price: 1800,
    lat: 53.2707,
    lng: -9.0568,
    img: "https://images.unsplash.com/photo-1572120360610-d971b9d7767c"
  },
  {
    id: "seed-3",
    title: "Cozy 1 Bed",
    county: "Cork",
    price: 1400,
    lat: 51.8985,
    lng: -8.4756,
    img: "https://images.unsplash.com/photo-1505691938895-1758d7feb511"
  }
];

/* =========================
   2. LOAD USER LISTINGS
========================= */
const userListings = JSON.parse(localStorage.getItem("listings")) || [];

/* =========================
   3. MERGE BOTH SOURCES
========================= */
const properties = [...seedListings, ...userListings];

/* =========================
   MAP (STABLE)
========================= */
const irelandBounds = L.latLngBounds([51.3,-10.6],[55.5,-5.3]);
const map = L.map("map", {
  maxBounds: irelandBounds,
  maxBoundsViscosity: 1.0,
  minZoom: 6,
  maxZoom: 13
});
map.fitBounds(irelandBounds);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap",
  noWrap: true
}).addTo(map);

let markers = [];

/* =========================
   RENDER
========================= */
function render(list) {
  const listings = document.getElementById("listings");
  listings.innerHTML = "";
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  list.forEach(p => {
    listings.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <div class="card-content">
          <h3>${p.title}</h3>
          <p>${p.county}</p>
          <div class="price">€${p.price} / month</div>
        </div>
      </div>
    `;

    const marker = L.marker([p.lat, p.lng])
      .addTo(map)
      .bindPopup(`<strong>${p.title}</strong>`);
    markers.push(marker);
  });
}

/* =========================
   FILTERS
========================= */
function applyFilters() {
  const county = document.getElementById("county").value;
  const maxPrice = document.getElementById("maxPrice").value;

  const filtered = properties.filter(p =>
    (!county || p.county === county) &&
    (!maxPrice || p.price <= maxPrice)
  );

  render(filtered);
}

/* INIT */
render(properties);
</script>

</body>
</html>
