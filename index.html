
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenRent.ie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
.search-bar input,
.search-bar select,
.search-bar button {
  padding: 12px;
  font-size: 16px;
  .map-section {
  background: white;
  padding: 30px 20px;
  margin: 20px;
  border-radius: 12px;
}

.map-placeholder {
  position: relative;
  height: 400px;
  background: #e5e7eb;
  border-radius: 12px;
  margin-top: 20px;
}

.pin {
  position: absolute;
  background: #2563eb;
  color: white;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 14px;
}

/* Approximate Ireland locations */
.dublin { top: 45%; left: 60%; }
.cork { top: 65%; left: 45%; }
.galway { top: 50%; left: 40%; }

}
}

header {
  background: white;
  padding: 20px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

header h1 {
  color: #2563eb;
  margin: 0;
}

.search-bar {
  display: flex;
  gap: 10px;
  padding: 20px;
  background: white;
}

.search-bar input, .search-bar button {
  padding: 12px;
  font-size: 16px;
}

.search-bar button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 20px rgba(0,0,0,.08);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.card-content h3 {
  margin: 0;
}

.price {
  color: #2563eb;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>OpenRent</h1>
  <strong>Rent • Buy • Discover</strong>
</header>

<div class="search-bar">
<select id="county">
  <option value="">Select County</option>
  <option>Dublin</option>
  <option>Cork</option>
  <option>Galway</option>
  <option>Limerick</option>
  <option>Waterford</option>
  <option>Nationwide</option>
</select>

<input id="maxPrice" placeholder="Max Price (€)">
<button onclick="filterProperties()">Search</button>


  <input placeholder="Max Price">
  <button>Search</button>
</div>
<section class="map-section">
  <h2>Search rentals on the map</h2>
  <p>Explore rental properties across Ireland. (Map search coming soon)</p>

  <div class="map-placeholder">
    <div class="pin dublin">Dublin</div>
    <div class="pin cork">Cork</div>
    <div class="pin galway">Galway</div>
  </div>
</section>
<div class="container">

  <div class="card" data-county="Dublin" data-price="2100">

    <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994">
    <div class="card-content">
      <h3>
  <a href="property.html" style="text-decoration:none;color:black;">
    Modern 2 Bed Apartment
  </a>
</h3>

      <p>Dublin City</p>
      <div class="price">€2,100 / month</div>
    </div>
  </div>

  <div class="card" data-county="Galway" data-price="2500">

    <img src="https://images.unsplash.com/photo-1572120360610-d971b9d7767c">
    <div class="card-content">
      <h3>
  <a href="property.html" style="text-decoration:none;color:black;">
    Modern 2 Bed Apartment
  </a>
</h3>

      <p>Galway</p>
      <div class="price">€2,500 / month</div>
    </div>
  </div>

  <div class="card" data-county="Cork" data-price="1300">

    <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511">
    <div class="card-content">
     <h3>
  <a href="property.html" style="text-decoration:none;color:black;">
    Modern 2 Bed Apartment
  </a>
</h3>

      <p>Cork City</p>
      <div class="price">€1,300 / month</div>
    </div>
  </div>

</div>
<script>
function filterProperties() {
  const selectedCounty = document.getElementById("county").value;
  const maxPrice = document.getElementById("maxPrice").value;
  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    const cardCounty = card.getAttribute("data-county");
    const cardPrice = card.getAttribute("data-price");

    let show = true;

    if (selectedCounty && selectedCounty !== "Nationwide" && cardCounty !== selectedCounty) {
      show = false;
    }

    if (maxPrice && Number(cardPrice) > Number(maxPrice)) {
      show = false;
    }

    card.style.display = show ? "block" : "none";
  });
}
</script>

</body>
</html>
