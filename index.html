<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RentIreland.ie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  background: #f5f7fa;
}

header {
  background: white;
  padding: 20px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

header h1 {
  margin: 0;
  color: #2563eb;
}

header a {
  text-decoration: none;
  color: #2563eb;
  font-weight: bold;
}

/* SEARCH */
.search-bar {
  background: white;
  padding: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.search-bar select,
.search-bar input,
.search-bar button {
  padding: 12px;
  font-size: 16px;
}

.search-bar button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

/* MAP */
.map-section {
  margin: 20px;
  background: white;
  padding: 20px;
  border-radius: 14px;
}

#map {
  height: 450px;
  border-radius: 14px;
}

/* LISTINGS */
.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.card-content h3 {
  margin: 0 0 5px;
}

.card-content a {
  text-decoration: none;
  color: black;
}

.price {
  color: #2563eb;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>RentIreland</h1>
  <a href="upload.html">+ Add Listing</a>
</header>

<div class="search-bar">
  <select id="county">
    <option value="">County</option>
    <option>Dublin</option>
    <option>Galway</option>
    <option>Cork</option>
  </select>
  <input id="maxPrice" placeholder="Max rent (€)">
  <button onclick="applyFilters()">Search</button>
</div>

<section class="map-section">
  <h2>Search rentals on the map</h2>
  <div id="map"></div>
</section>

<div class="container" id="listings"></div>

<script>
/* SINGLE SOURCE OF TRUTH */
const properties = [
  {
    title: "Modern 2 Bed Apartment",
    county: "Dublin",
    price: 2100,
    lat: 53.3498,
    lng: -6.2603,
    img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994",
    url: "property.html"
  },
  {
    title: "Bright City Apartment",
    county: "Galway",
    price: 1800,
    lat: 53.2707,
    lng: -9.0568,
    img: "https://images.unsplash.com/photo-1572120360610-d971b9d7767c",
    url: "property.html"
  },
  {
    title: "Cozy 1 Bed",
    county: "Cork",
    price: 1400,
    lat: 51.8985,
    lng: -8.4756,
    img: "https://images.unsplash.com/photo-1505691938895-1758d7feb511",
    url: "property.html"
  }
];

/* IRELAND-LOCKED MAP */
const irelandBounds = L.latLngBounds([51.3,-10.6],[55.5,-5.3]);
const map = L.map("map", { maxBounds: irelandBounds });
map.fitBounds(irelandBounds);
map.setMinZoom(map.getZoom());
map.setMaxZoom(13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  noWrap: true,
  attribution: "© OpenStreetMap"
}).addTo(map);

let markers = [];

/* RENDER */
function render(list) {
  const container = document.getElementById("listings");
  container.innerHTML = "";
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  list.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <div class="card-content">
          <h3><a href="${p.url}">${p.title}</a></h3>
          <p>${p.county}</p>
          <div class="price">€${p.price} / month</div>
        </div>
      </div>
    `;

    const marker = L.marker([p.lat, p.lng])
      .addTo(map)
      .bindPopup(`<strong>${p.title}</strong><br><a href="${p.url}">View property</a>`);
    markers.push(marker);
  });
}

/* FILTERS */
function applyFilters() {
  const county = document.getElementById("county").value;
  const maxPrice = document.getElementById("maxPrice").value;

  const filtered = properties.filter(p =>
    (!county || p.county === county) &&
    (!maxPrice || p.price <= maxPrice)
  );

  render(filtered);
}

/* INIT */
render(properties);
</script>

</body>
</html>
