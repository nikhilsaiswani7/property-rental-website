<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RentIreland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
}

header {
  background: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  color: #2563eb;
}

.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  color: #2563eb;
  font-weight: bold;
}

.desc {
  font-size: 14px;
  color: #555;
  margin-top: 6px;
}
</style>
</head>

<body>

<header>
  <h1>RentIreland</h1>
</header>

<div class="container" id="listings"></div>

<script>
/* SINGLE SOURCE OF TRUTH */
const listings = [
  {
    id: "seed-1",
    title: "Modern 2 Bed Apartment",
    county: "Dublin",
    price: 2100,
    img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994",
    description: "Bright and modern two-bedroom apartment located in Dublin city centre. Close to transport and amenities."
  },
  {
    id: "seed-2",
    title: "Galway City Apartment",
    county: "Galway",
    price: 1800,
    img: "https://images.unsplash.com/photo-1572120360610-d971b9d7767c",
    description: "Comfortable apartment in Galway city, ideal for professionals and students."
  },
  {
    id: "seed-3",
    title: "Cozy 1 Bed",
    county: "Cork",
    price: 1400,
    img: "https://images.unsplash.com/photo-1505691938895-1758d7feb511",
    description: "Cozy one-bedroom property located close to Cork city centre."
  }
];

const container = document.getElementById("listings");

listings.forEach(p => {
  container.innerHTML += `
    <div class="card">
      <img src="${p.img}">
      <div class="card-content">
        <h3>
          <a href="property.html?id=${p.id}" style="text-decoration:none;color:black">
            ${p.title}
          </a>
        </h3>
        <p>${p.county}</p>
        <div class="price">€${p.price} / month</div>
        <p class="desc">${p.description.slice(0, 90)}...</p>
      </div>
    </div>
  `;
});
</script>

</body>
</html>
