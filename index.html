
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenRent.ie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
}

header {
  background: white;
  padding: 20px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

header h1 {
  color: #2563eb;
  margin: 0;
}

.search-bar {
  display: flex;
  gap: 10px;
  padding: 20px;
  background: white;
}

.search-bar input, .search-bar button {
  padding: 12px;
  font-size: 16px;
}

.search-bar button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 20px rgba(0,0,0,.08);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.card-content h3 {
  margin: 0;
}

.price {
  color: #2563eb;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>HomeFinder</h1>
  <strong>Rent • Buy • Discover</strong>
</header>

<div class="search-bar">
  <input placeholder="City or Area">
  <input placeholder="Max Price">
  <button>Search</button>
</div>

<div class="container">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994">
    <div class="card-content">
      <h3>Modern 2 Bed Apartment</h3>
      <p>Dublin City</p>
      <div class="price">€2,100 / month</div>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1572120360610-d971b9d7767c">
    <div class="card-content">
      <h3>Luxury 3 Bed House</h3>
      <p>Galway</p>
      <div class="price">€2,500 / month</div>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511">
    <div class="card-content">
      <h3>Cozy Studio</h3>
      <p>Cork City</p>
      <div class="price">€1,300 / month</div>
    </div>
  </div>

</div>

</body>
</html>
