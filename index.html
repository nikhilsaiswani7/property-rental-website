<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RentIreland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background:#f5f7fa; margin:0; }
header { background:white; padding:20px; }
.container { padding:20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
.card { background:white; border-radius:12px; overflow:hidden; }
.card img { width:100%; height:200px; object-fit:cover; }
.card-content { padding:15px; }
.price { color:#2563eb; font-weight:bold; }
</style>
</head>

<body>

<header>
  <h1>RentIreland</h1>
</header>

<div class="container" id="listings"></div>

<script>
const listings = [
  {
    id:"seed-1",
    title:"Modern 2 Bed Apartment",
    county:"Dublin",
    price:2100,
    img:"https://images.unsplash.com/photo-1568605114967-8130f3a36994",
    description:"Bright and modern apartment in Dublin city centre."
  },
  {
    id:"seed-2",
    title:"Galway City Apartment",
    county:"Galway",
    price:1800,
    img:"https://images.unsplash.com/photo-1572120360610-d971b9d7767c",
    description:"Comfortable apartment in Galway city."
  }
];

const box = document.getElementById("listings");

listings.forEach(p => {
  box.innerHTML += `
    <div class="card">
      <img src="${p.img}">
      <div class="card-content">
        <h3>
          <a href="property.html?id=${p.id}" style="text-decoration:none;color:black">
            ${p.title}
          </a>
        </h3>
        <p>${p.county}</p>
        <div class="price">€${p.price} / month</div>
        <p>${p.description}</p>
      </div>
    </div>
  `;
});
</script>

</body>
</html>
