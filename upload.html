<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Listing | RentIreland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  background: #f5f7fa;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: 50px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

input, textarea, button {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  font-size: 16px;
}

textarea {
  min-height: 120px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>Add Listing</h1>

  <form id="uploadForm">
    <input placeholder="Property title" required>
    <input placeholder="Monthly rent (€)" required>
    <input placeholder="Image URL" required>
    <textarea placeholder="Description" required></textarea>
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>
</div>

<script>
document.getElementById("uploadForm").addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("status").innerText =
    "✅ Listing submitted. (Manual approval in MVP)";
});
</script>

</body>
</html>
