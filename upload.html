<!DOCTYPE html>
<html>
<head>
<title>Add Listing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family:Arial; background:#f5f7fa; }
.container { max-width:600px; margin:40px auto; background:white; padding:20px; border-radius:12px; }
input,select,textarea,button { width:100%; padding:12px; margin-bottom:10px; }
button { background:#2563eb; color:white; border:none; cursor:pointer; }
</style>
</head>

<body>
<div class="container">
<h2>Add Listing</h2>
<form id="form">
<input id="title" placeholder="Title" required>
<select id="county"><option>Dublin</option><option>Galway</option><option>Cork</option></select>
<input id="price" type="number" placeholder="Price" required>
<input id="img" placeholder="Image URL" required>
<input id="lat" placeholder="Latitude" required>
<input id="lng" placeholder="Longitude" required>
<textarea id="desc" placeholder="Description"></textarea>
<button>Add</button>
</form>
<p id="msg"></p>
</div>

<script>
document.getElementById("form").onsubmit=e=>{
  e.preventDefault();
  const listing={
    id:"user-"+Date.now(),
    title:title.value,
    county:county.value,
    price:+price.value,
    img:img.value,
    lat:+lat.value,
    lng:+lng.value,
    description:desc.value
  };
  const list=JSON.parse(localStorage.getItem("listings"))||[];
  list.push(listing);
  localStorage.setItem("listings",JSON.stringify(list));
  msg.innerText="Saved. Go back to homepage.";
  e.target.reset();
};
</script>
</body>
</html>
