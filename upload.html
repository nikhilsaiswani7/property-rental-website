<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Listing | RentIreland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  background: #f5f7fa;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

input, textarea, select, button {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  font-size: 16px;
}

textarea {
  min-height: 140px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Add a Rental Listing</h1>

  <form id="listingForm">
    <input id="title" placeholder="Property title" required>
    <select id="county" required>
      <option value="">County</option>
      <option>Dublin</option>
      <option>Galway</option>
      <option>Cork</option>
    </select>
    <input id="price" type="number" placeholder="Monthly rent (€)" required>
    <input id="image" placeholder="Image URL" required>
    <input id="lat" placeholder="Latitude (e.g. 53.3498)" required>
    <input id="lng" placeholder="Longitude (e.g. -6.2603)" required>
    <textarea id="description" placeholder="Description" required></textarea>

    <button type="submit">Save Listing</button>
  </form>

  <p id="status"></p>
</div>

<script>
document.getElementById("listingForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const listing = {
  id: "user-" + Date.now(),   // unique ID
  title: title.value,
  county: county.value,
  price: Number(price.value),
  img: image.value,
  lat: Number(lat.value),
  lng: Number(lng.value),
  description: description.value
};

  const existing = JSON.parse(localStorage.getItem("listings")) || [];
  existing.push(listing);
  localStorage.setItem("listings", JSON.stringify(existing));

  document.getElementById("status").innerText =
    "✅ Listing saved! Go back to homepage to view it.";

  this.reset();
});
</script>

</body>
</html>
