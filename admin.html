<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family:Arial; background:#f5f7fa; }
.container { max-width:900px; margin:30px auto; background:white; padding:20px; border-radius:12px; }
.enq { border-bottom:1px solid #ddd; padding:10px 0; }
</style>
</head>

<body>
<div class="container" id="inbox"></div>

<script>
const data=JSON.parse(localStorage.getItem("enquiries"))||[];
if(!data.length){ inbox.innerHTML="No enquiries"; }
data.reverse().forEach(e=>{
  inbox.innerHTML+=`
  <div class="enq">
    <strong>${e.title}</strong><br>
    ${e.name} (${e.email})<br>
    ${e.message}
  </div>`;
});
</script>
</body>
</html>
