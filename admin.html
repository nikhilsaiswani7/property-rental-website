<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel | RentIreland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
}

/* LOGIN */
.login {
  max-width: 400px;
  margin: 120px auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  text-align: center;
}

.login input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
}

.login button {
  margin-top: 15px;
  padding: 12px;
  width: 100%;
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

/* ADMIN */
header {
  background: white;
  padding: 20px;
  border-bottom: 1px solid #ddd;
}

header h1 {
  margin: 0;
  color: #2563eb;
}

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 20px;
}

.section {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 30px;
}

.section h2 {
  margin-top: 0;
  border-bottom: 1px solid #eee;
  padding-bottom: 10px;
}

.listing, .enquiry {
  border-bottom: 1px solid #eee;
  padding: 12px 0;
}

.listing:last-child,
.enquiry:last-child {
  border-bottom: none;
}

.meta {
  color: #555;
  font-size: 14px;
}

button {
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  margin-top: 6px;
}

button.danger {
  background: #dc2626;
  color: white;
}

button.edit {
  background: #2563eb;
  color: white;
  margin-right: 6px;
}

/* EDIT FORM */
.edit-form {
  background: #f9fafb;
  padding: 15px;
  border-radius: 8px;
  margin-top: 10px;
}

.edit-form input,
.edit-form textarea,
.edit-form select {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <h2>Admin Login</h2>
  <input id="password" type="password" placeholder="Enter admin password">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- ADMIN -->
<div id="adminPanel" style="display:none;">

<header>
  <h1>Admin Panel</h1>
</header>

<div class="container">

  <!-- LISTINGS -->
  <div class="section">
    <h2>Listings</h2>
    <div id="listings"></div>
  </div>

  <!-- ENQUIRIES -->
  <div class="section">
    <h2>Enquiries</h2>
    <div id="enquiries"></div>
  </div>

</div>
</div>

<script>
/* =========================
   CONFIG
========================= */
const ADMIN_PASSWORD = "admin123";

/* =========================
   LOGIN
========================= */
function login() {
  if (password.value === ADMIN_PASSWORD) {
    sessionStorage.setItem("admin-auth", "true");
    showAdmin();
  } else {
    error.innerText = "Incorrect password";
  }
}

function showAdmin() {
  loginBox.style.display = "none";
  adminPanel.style.display = "block";
}

if (sessionStorage.getItem("admin-auth") === "true") {
  showAdmin();
}

/* =========================
   LISTINGS
========================= */
const seedListings = [
  { id:"seed-1", title:"Modern 2 Bed Apartment" },
  { id:"seed-2", title:"Galway City Apartment" },
  { id:"seed-3", title:"Cozy 1 Bed" }
];

let userListings = JSON.parse(localStorage.getItem("listings")) || [];
const listingsBox = document.getElementById("listings");

function renderListings() {
  listingsBox.innerHTML = "";

  [...seedListings, ...userListings].forEach(l => {
    listingsBox.innerHTML += `
      <div class="listing">
        <strong>${l.title}</strong>
        <div class="meta">ID: ${l.id}</div>

        ${
          l.id.startsWith("user-")
            ? `
              <button class="edit" onclick="openEdit('${l.id}')">Edit</button>
              <button class="danger" onclick="deleteListing('${l.id}')">Delete</button>
              <div id="edit-${l.id}"></div>
            `
            : `<div class="meta">Seed listing (read-only)</div>`
        }
      </div>
    `;
  });
}

renderListings();

function openEdit(id) {
  const listing = userListings.find(l => l.id === id);
  const box = document.getElementById("edit-" + id);

  box.innerHTML = `
    <div class="edit-form">
      <input id="title-${id}" value="${listing.title}">
      <input id="price-${id}" type="number" value="${listing.price}">
      <select id="county-${id}">
        <option ${listing.county==="Dublin"?"selected":""}>Dublin</option>
        <option ${listing.county==="Galway"?"selected":""}>Galway</option>
        <option ${listing.county==="Cork"?"selected":""}>Cork</option>
      </select>
      <textarea id="desc-${id}">${listing.description || ""}</textarea>
      <button class="edit" onclick="saveEdit('${id}')">Save</button>
    </div>
  `;
}

function saveEdit(id) {
  const l = userListings.find(x => x.id === id);

  l.title = document.getElementById("title-"+id).value;
  l.price = Number(document.getElementById("price-"+id).value);
  l.county = document.getElementById("county-"+id).value;
  l.description = document.getElementById("desc-"+id).value;

  localStorage.setItem("listings", JSON.stringify(userListings));
  renderListings();
}

function deleteListing(id) {
  if (!confirm("Delete this listing?")) return;
  userListings = userListings.filter(l => l.id !== id);
  localStorage.setItem("listings", JSON.stringify(userListings));
  renderListings();
}

/* =========================
   ENQUIRIES
========================= */
let enquiries = JSON.parse(localStorage.getItem("enquiries")) || [];
const enquiriesBox = document.getElementById("enquiries");

function renderEnquiries() {
  enquiriesBox.innerHTML = "";

  if (!enquiries.length) {
    enquiriesBox.innerHTML = "<p>No enquiries yet.</p>";
    return;
  }

  enquiries.slice().reverse().forEach((e, i) => {
    enquiriesBox.innerHTML += `
      <div class="enquiry">
        <strong>${e.title}</strong>
        <div class="meta">${new Date(e.date).toLocaleString()}</div>
        <p><strong>${e.name}</strong> (${e.email})</p>
        <p>${e.message}</p>
        <button onclick="replyEmail(${i})">Reply via Email</button>
<button class="danger" onclick="deleteEnquiry(${i})">Delete enquiry</button>

      </div>
    `;
  });
}

renderEnquiries();

function deleteEnquiry(index) {
  if (!confirm("Delete this enquiry?")) return;
  enquiries.splice(enquiries.length - 1 - index, 1);
  localStorage.setItem("enquiries", JSON.stringify(enquiries));
  renderEnquiries();
}
  function replyEmail(index) {
  const e = enquiries[enquiries.length - 1 - index];

  const subject = encodeURIComponent(
    "Regarding: " + e.title
  );

  const body = encodeURIComponent(
    "Hi " + e.name + ",\n\n" +
    "Thanks for your enquiry about \"" + e.title + "\".\n\n" +
    "Your message:\n" +
    "\"" + e.message + "\"\n\n" +
    "Best regards,\n"
  );

  window.location.href =
    "mailto:" + e.email +
    "?subject=" + subject +
    "&body=" + body;
}
</script>

</body>
</html>
