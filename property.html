<head>
  <title>Property Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .price {
      color: #2563eb;
      font-size: 26px;
      font-weight: bold;
    }

    /* ENQUIRY FORM */
    .enquiry {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .enquiry input,
    .enquiry textarea {
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .enquiry textarea {
      min-height: 120px;
    }

    .enquiry button {
      background: #2563eb;
      color: white;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
