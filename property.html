<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Property Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
}

header {
  background: white;
  padding: 20px;
}

header a {
  text-decoration: none;
  color: #2563eb;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

img {
  width: 100%;
  height: 400px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 20px;
}

.price {
  color: #2563eb;
  font-size: 26px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Back to listings</a>
</header>

<div class="container" id="property"></div>

<script>
/* SAME DATA, SAME STRUCTURE */
const listings = [
  {
    id: "seed-1",
    title: "Modern 2 Bed Apartment",
    county: "Dublin",
    price: 2100,
    img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994",
    description: "Bright and modern two-bedroom apartment located in Dublin city centre. Close to transport and amenities."
  },
  {
    id: "seed-2",
    title: "Galway City Apartment",
    county: "Galway",
    price: 1800,
    img: "https://images.unsplash.com/photo-1572120360610-d971b9d7767c",
    description: "Comfortable apartment in Galway city, ideal for professionals and students."
  },
  {
    id: "seed-3",
    title: "Cozy 1 Bed",
    county: "Cork",
    price: 1400,
    img: "https://images.unsplash.com/photo-1505691938895-1758d7feb511",
    description: "Cozy one-bedroom property located close to Cork city centre."
  }
];

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const property = listings.find(p => p.id === id);
const box = document.getElementById("property");

if (!property) {
  box.innerHTML = "<p>Property not found.</p>";
} else {
  box.innerHTML = `
    <img src="${property.img}">
    <h1>${property.title}</h1>
    <p>${property.county}</p>
    <div class="price">€${property.price} / month</div>
    <p>${property.description}</p>
  `;
}
</script>

</body>
</html>
