<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Property Details | RentIreland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
}

header {
  background: white;
  padding: 20px;
  border-bottom: 1px solid #eee;
}

header a {
  text-decoration: none;
  color: #2563eb;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

img {
  width: 100%;
  height: 400px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 20px;
}

.price {
  color: #2563eb;
  font-size: 26px;
  font-weight: bold;
}

.meta {
  color: #555;
  margin-bottom: 15px;
}

.description {
  margin-top: 20px;
  line-height: 1.6;
}

.enquiry {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.enquiry input,
.enquiry textarea {
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ddd;
}

.enquiry textarea {
  min-height: 140px;
}

.enquiry button {
  background: #2563eb;
  color: white;
  padding: 14px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.not-found {
  text-align: center;
  padding: 60px;
  font-size: 20px;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Back to listings</a>
</header>

<div class="container" id="property">
  <!-- Content injected by JS -->
</div>

<script>
/* =========================
   GET PROPERTY ID
========================= */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/* =========================
   SEED LISTINGS (MATCH index.html)
========================= */
const seedListings = [
  {
    id: "seed-1",
    title: "Modern 2 Bed Apartment",
    county: "Dublin",
    price: 2100,
    img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994",
    description:
      "Bright and modern two-bedroom apartment located in Dublin city centre. Close to transport, shops, and amenities."
  },
  {
    id: "seed-2",
    title: "Galway City Apartment",
    county: "Galway",
    price: 1800,
    img: "https://images.unsplash.com/photo-1572120360610-d971b9d7767c",
    description:
      "Comfortable apartment in Galway city, ideal for professionals and students."
  },
  {
    id: "seed-3",
    title: "Cozy 1 Bed",
    county: "Cork",
    price: 1400,
    img: "https://images.unsplash.com/photo-1505691938895-1758d7feb511",
    description:
      "Cozy one-bedroom property located close to Cork city centre."
  }
];

/* =========================
   LOAD USER LISTINGS
========================= */
const userListings = JSON.parse(localStorage.getItem("listings")) || [];

/* MERGE */
const allListings = [...seedListings, ...userListings];

/* FIND PROPERTY */
const property = allListings.find(p => p.id === id);

const container = document.getElementById("property");

/* =========================
   RENDER
========================= */
if (!property) {
  container.innerHTML = `
    <div class="not-found">
      Property not found.
    </div>
  `;
} else {
  container.innerHTML = `
    <img src="${property.img}">
    <h1>${property.title}</h1>
    <div class="meta">${property.county}</div>
    <div class="price">€${property.price} / month</div>

    <div class="description">
      ${property.description || "No description provided."}
    </div>

    <h3>Send an enquiry</h3>

    <form class="enquiry">
      <input type="text" placeholder="Your name" required>
      <input type="email" placeholder="Your email" required>
      <textarea placeholder="Your message to the landlord" required></textarea>
      <button type="submit">Send Enquiry</button>
    </form>
  `;
}

/* =========================
   ENQUIRY HANDLER
========================= */
document.addEventListener("submit", function(e) {
  if (e.target.classList.contains("enquiry")) {
    e.preventDefault();
    alert("Enquiry sent! (MVP demo)");
  }
});
</script>

</body>
</html>
