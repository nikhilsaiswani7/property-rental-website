<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Property</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background:#f5f7fa; margin:0; }
.container { max-width:900px; margin:30px auto; background:white; padding:20px; border-radius:12px; }
img { width:100%; height:400px; object-fit:cover; border-radius:12px; }
.price { color:#2563eb; font-size:24px; font-weight:bold; }
</style>
</head>

<body>

<div class="container" id="box"></div>

<script>
const data = [
  {
    id:"seed-1",
    title:"Modern 2 Bed Apartment",
    county:"Dublin",
    price:2100,
    img:"https://images.unsplash.com/photo-1568605114967-8130f3a36994",
    description:"Bright and modern apartment in Dublin city centre."
  },
  {
    id:"seed-2",
    title:"Galway City Apartment",
    county:"Galway",
    price:1800,
    img:"https://images.unsplash.com/photo-1572120360610-d971b9d7767c",
    description:"Comfortable apartment in Galway city."
  }
];

const id = new URLSearchParams(location.search).get("id");
const p = data.find(x => x.id === id);
const box = document.getElementById("box");

if (!p) {
  box.innerHTML = "<p>Property not found.</p>";
} else {
  box.innerHTML = `
    <img src="${p.img}">
    <h1>${p.title}</h1>
    <p>${p.county}</p>
    <div class="price">€${p.price} / month</div>
    <p>${p.description}</p>
  `;
}
</script>

</body>
</html>
