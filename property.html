<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Property Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { margin:0; font-family:Arial,sans-serif; background:#f5f7fa; }

header {
  background:white;
  padding:20px;
}

header a {
  text-decoration:none;
  color:#2563eb;
  font-weight:bold;
}

.container {
  max-width:900px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:12px;
}

img {
  width:100%;
  height:400px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:20px;
}

.price {
  color:#2563eb;
  font-size:26px;
  font-weight:bold;
}

form {
  margin-top:25px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

input, textarea, button {
  padding:12px;
  font-size:16px;
}

button {
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

.success {
  color:green;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Back to listings</a>
</header>

<div class="container" id="box"></div>

<script>
/* =========================
   LOAD PROPERTY DATA
========================= */
const seedListings = [
  {
    id:"seed-1",
    title:"Modern 2 Bed Apartment",
    county:"Dublin",
    price:2100,
    img:"https://images.unsplash.com/photo-1568605114967-8130f3a36994",
    description:"Bright and modern two-bedroom apartment located in Dublin city centre."
  },
  {
    id:"seed-2",
    title:"Galway City Apartment",
    county:"Galway",
    price:1800,
    img:"https://images.unsplash.com/photo-1572120360610-d971b9d7767c",
    description:"Comfortable apartment in Galway city."
  },
  {
    id:"seed-3",
    title:"Cozy 1 Bed",
    county:"Cork",
    price:1400,
    img:"https://images.unsplash.com/photo-1505691938895-1758d7feb511",
    description:"Cozy one-bedroom property close to Cork city centre."
  }
];

const userListings = JSON.parse(localStorage.getItem("listings")) || [];
const all = [...seedListings, ...userListings];

const id = new URLSearchParams(location.search).get("id");
const p = all.find(x => x.id === id);

const box = document.getElementById("box");

if (!p) {
  box.innerHTML = "<p>Property not found.</p>";
  throw "";
}

box.innerHTML = `
  <img src="${p.img}">
  <h1>${p.title}</h1>
  <p>${p.county}</p>
  <div class="price">€${p.price} / month</div>
  <p>${p.description}</p>

  <h3>Send an enquiry</h3>
  <form id="enquiry">
    <input id="name" placeholder="Your name" required>
    <input id="email" type="email" placeholder="Your email" required>
    <textarea id="message" placeholder="Message" required></textarea>
    <button>Send Enquiry</button>
  </form>
  <div class="success" id="ok"></div>
`;

enquiry.onsubmit = e => {
  e.preventDefault();
  const arr = JSON.parse(localStorage.getItem("enquiries")) || [];
  arr.push({
    propertyId:id,
    title:p.title,
    name:name.value,
    email:email.value,
    message:message.value,
    date:new Date().toISOString()
  });
  localStorage.setItem("enquiries", JSON.stringify(arr));
  ok.innerText = "Enquiry sent successfully.";
  e.target.reset();
};
</script>

</body>
</html>
