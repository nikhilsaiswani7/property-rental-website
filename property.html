<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Property Details | RentIreland</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
    }

    .hero {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    .price {
      color: #2563eb;
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0;
    }

    .meta {
      color: #555;
      font-size: 15px;
      margin-bottom: 20px;
    }

    /* ENQUIRY FORM */
    .enquiry {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 30px;
    }

    .enquiry input,
    .enquiry textarea {
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .enquiry textarea {
      min-height: 120px;
    }

    .enquiry button {
      background: #2563eb;
      color: white;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .verified {
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">


  <img
    class="hero"
    src="https://images.unsplash.com/photo-1568605114967-8130f3a36994"
    alt="Property image"
  >

  <h1>Modern 2 Bed Apartment</h1>

  <div class="meta">
    📍 Dublin City · Apartment · Furnished
  </div>

  <div class="price">€2,100 / month</div>

  <div class="verified">✔ Verified Listing</div>

  <h3>Description</h3>
  <p>
    Bright and modern two-bedroom apartment located in the heart of Dublin.
    Close to public transport, shops, and amenities. Ideal for professionals
    or couples.
  </p>

  <h3>Send an enquiry</h3>

  <form class="enquiry">
    <input type="text" placeholder="Your name" required>
    <input type="email" placeholder="Your email" required>
    <textarea placeholder="Your message to the landlord" required></textarea>
    <button type="submit">Send Enquiry</button>
  </form>

</div>

<script>
document.querySelector(".enquiry").addEventListener("submit", function(e) {
  e.preventDefault();

  const subject = encodeURIComponent("Rental Enquiry – RentIreland");
  const body = encodeURIComponent(
    "Name: " + this[0].value + "\n" +
    "Email: " + this[1].value + "\n\n" +
    this[2].value
  );

  window.location.href =
    "mailto:landlord@example.com?subject=" + subject + "&body=" + body;
});
</script>

</body>
</html>
