<!DOCTYPE html>
<html>
<head>
<title>Property</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family:Arial; background:#f5f7fa; }
.container { max-width:900px; margin:30px auto; background:white; padding:20px; border-radius:12px; }
img { width:100%; height:400px; object-fit:cover; border-radius:12px; }
.price { color:#2563eb; font-size:24px; font-weight:bold; }
form { margin-top:20px; display:flex; flex-direction:column; gap:10px; }
input,textarea,button { padding:12px; font-size:16px; }
button { background:#2563eb; color:white; border:none; }
</style>
</head>

<body>
<div class="container" id="box"></div>

<script>
const id=new URLSearchParams(location.search).get("id");
const seed=[
  {id:"seed-1",title:"Modern 2 Bed Apartment",county:"Dublin",price:2100,img:"https://images.unsplash.com/photo-1568605114967-8130f3a36994",description:"Bright apartment"},
  {id:"seed-2",title:"Galway City Apartment",county:"Galway",price:1800,img:"https://images.unsplash.com/photo-1572120360610-d971b9d7767c",description:"City apartment"},
  {id:"seed-3",title:"Cozy 1 Bed",county:"Cork",price:1400,img:"https://images.unsplash.com/photo-1505691938895-1758d7feb511",description:"Cozy home"}
];
const users=JSON.parse(localStorage.getItem("listings"))||[];
const all=[...seed,...users];
const p=all.find(x=>x.id===id);

if(!p){ box.innerHTML="Not found"; throw ""; }

box.innerHTML=`
<img src="${p.img}">
<h1>${p.title}</h1>
<p>${p.county}</p>
<div class="price">€${p.price}</div>
<p>
  ${p.description ? p.description : "No description provided."}
</p>


<form id="enq">
<input id="n" placeholder="Name" required>
<input id="e" type="email" placeholder="Email" required>
<textarea id="m" placeholder="Message"></textarea>
<button>Send enquiry</button>
</form>
<p id="ok"></p>
`;

enq.onsubmit=e=>{
  e.preventDefault();
  const arr=JSON.parse(localStorage.getItem("enquiries"))||[];
  arr.push({propertyId:id,title:p.title,name:n.value,email:e.value,message:m.value,date:new Date()});
  localStorage.setItem("enquiries",JSON.stringify(arr));
  ok.innerText="Enquiry sent";
  e.target.reset();
};
</script>
</body>
</html>
